name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "hotfix/**"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: iran_tutor_test
          POSTGRES_USER: iran_tutor
          POSTGRES_PASSWORD: iran_tutor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iran_tutor -d iran_tutor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DEMO_MODE: "false"
      DATABASE_URL: postgresql+asyncpg://iran_tutor:iran_tutor_test@127.0.0.1:5432/iran_tutor_test
      LLM_BASE_URL: https://example.invalid/v1
      LLM_API_KEY: unit-test-key
      TUTOR_MODEL: unit-test-model
      VISION_MODEL_A: unit-test-model-a
      VISION_MODEL_B: unit-test-model-b
      VISION_MODEL_PRIMARY: unit-test-model-a
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "123"
      RATE_LIMIT_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply migrations to a fresh PostgreSQL database
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend test suite
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        # The repository already contains setState-in-effect patterns in async data loaders.
        # Keep reporting them without making this legacy rule block all CI jobs.
        run: "npm run lint -- --rule 'react-hooks/set-state-in-effect: warn'"
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
